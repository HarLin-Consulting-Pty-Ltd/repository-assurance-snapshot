name: Repository Assurance Snapshot
description: Generate a read-only evidence dossier for a public GitHub repository revision.
author: HarLin Consulting Pty Ltd
branding:
  icon: shield
  color: blue
inputs:
  repository:
    description: Public repository in owner/name form or as a GitHub URL.
    required: false
    default: ${{ github.repository }}
  output:
    description: Directory for ASSURANCE.md, assurance.json and evidence_manifest.json.
    required: false
    default: repository-assurance
runs:
  using: composite
  steps:
    - name: Install the snapshot collector
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Generate the read-only dossier
      shell: bash
      run: repository-assurance-snapshot "${{ inputs.repository }}" --output "${{ inputs.output }}"
